name: LexCompiler Neuro-Symbolic Compliance & Z3 Formal PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lexcompiler-formal-proof:
    name: Z3 Law-to-AST Formal Verification & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Open Policy Agent (evaluates the generated Rego in tests)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.4.2

      - name: Install Dependencies
        run: npm ci

      - name: Install sandbox frameworks (FastAPI, Pydantic, fakeredis)
        run: npm run setup:sandbox

      - name: Python agent adapter tests (Pydantic-AI, LangGraph, Hermes, OpenAI Agents SDK)
        run: |
          python -m venv .venv-agents
          .venv-agents/bin/pip install -q -r agents/requirements-test.txt
          .venv-agents/bin/python -m pytest -q agents/tests

      - name: Type-check Client & Server
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Automated Vitest Suite (Z3 Prover, AST, MCP, RAG, Token Optimizer, Security)
        run: npm test

      - name: Z3 Verification Gate (fixture detection + remediation)
        run: npm run verify:cli

      - name: Execute End-to-End Real-World Sandbox Verification
        run: npm run verify:realworld

      - name: Build Production Client & Server Bundles
        run: npm run build

      - name: Export SARIF 2.1.0 Report
        run: npm run sarif -- lexcompiler.sarif

      - name: Upload SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexcompiler-sarif
          path: lexcompiler.sarif
