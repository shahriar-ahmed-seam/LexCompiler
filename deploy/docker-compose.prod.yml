# A small VPS (product guide, Phase 7): LexCompiler behind Caddy, which serves HTTPS.
#   cp deploy/env.production.example deploy/.env.production   # then fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# Only Caddy publishes ports. data/ (database, signing key, GitHub App credentials) and the
# daily backups live on named volumes; copy the backups volume off the machine as well.
services:
  lexcompiler:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - LEXCOMPILER_DATA_DIR=/app/data
      - LEXCOMPILER_BACKUP_DIR=/app/backups
      # Caddy is one hop away on the compose network.
      - LEXCOMPILER_TRUST_PROXY=1
      # Executes repository code: never on a public server (the app refuses to start with it).
      - LEXCOMPILER_ENABLE_RUNTIME_SANDBOX=0
    volumes:
      - lexcompiler-data:/app/data
      - lexcompiler-backups:/app/backups
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    depends_on: [lexcompiler]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - LEXCOMPILER_DOMAIN=${LEXCOMPILER_DOMAIN:?Set LEXCOMPILER_DOMAIN in deploy/.env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  lexcompiler-data:
  lexcompiler-backups:
  caddy-data:
  caddy-config:
